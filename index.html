<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивная страница (Задание 4)</title>
    <!-- Подключение стилей Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Подключение ваших собственных стилей -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Класс container центрирует контент и задает отступы по краям -->
    <div class="container mt-4 mb-4">
        
        <!-- Шапка сайта -->
        <header class="row bg-primary text-white p-3 mb-3 align-items-center rounded">
            <!-- Логотип (занимает 3 колонки из 12 на ПК) -->
            <div class="col-md-3 text-center mb-2 mb-md-0">
                <div class="border border-white rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                    Лого
                </div>
            </div>
            <!-- Название сайта (занимает 9 колонок, прижимается вправо на ПК) -->
            <div class="col-md-9 text-md-end">
                <h1 class="h4 m-0">Название сайта</h1>
            </div>
        </header>

        <!-- Навигация (на телефоне в столбик, на ПК в строку) -->
        <nav class="bg-primary text-white p-3 mb-3 rounded d-flex flex-column flex-md-row gap-3">
            <a href="#" class="text-white text-decoration-none">Ссылка меню 1</a>
            <a href="#" class="text-white text-decoration-none">Ссылка 2</a>
            <a href="#" class="text-white text-decoration-none">Ссылка 3</a>
        </nav>

        <!-- Основной контент (сетка из двух колонок на ПК) -->
        <main class="row">
            
            <!-- Левая колонка (Форма и Ссылки) -->
            <div class="col-md-6 mb-3">
                <!-- Форма -->
                <section class="bg-primary text-white p-3 mb-3 rounded">
                    <h2 class="h5 mb-3">Форма</h2>
                    <form action="#">
                        <div class="mb-2">
                            <label for="name" class="form-label">Имя:</label>
                            <input type="text" id="name" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-light btn-sm mt-2">Отправить</button>
                    </form>
                </section>

                <!-- Список ссылок (на телефоне уходит вниз благодаря order-last) -->
                <section class="bg-primary text-white p-3 rounded order-last order-md-first">
                    <h2 class="h5 mb-3">Список гиперссылок</h2>
                    <ul class="list-unstyled m-0">
                        <li class="mb-1"><a href="#" class="text-white">Гиперссылка 1</a></li>
                        <li class="mb-1"><a href="#" class="text-white">Гиперссылка 2</a></li>
                        <li><a href="#" class="text-white">Гиперссылка 3</a></li>
                    </ul>
                </section>
            </div>

            <!-- Правая колонка (Таблица) -->
            <div class="col-md-6 mb-3">
                <section class="bg-primary text-white p-3 rounded h-100">
                    <h2 class="h5 mb-3">Таблица</h2>
                    <table class="table table-bordered table-light m-0">
                        <thead>
                            <tr>
                                <th>Заголовок 1</th>
                                <th>Заголовок 2</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Ячейка 1</td>
                                <td>Ячейка 2</td>
                            </tr>
                            <tr>
                                <td>Ячейка 3</td>
                                <td>Ячейка 4</td>
                            </tr>
                        </tbody>
                    </table>
                </section>
</div>

        </main>

        <!-- Подвал сайта -->
        <footer class="bg-primary text-white p-3 rounded">
            <p class="m-0">(c) Сергей Синица</p>
        </footer>

    </div>

</body>
</html>
